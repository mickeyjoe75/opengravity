[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengravity"
version = "0.1.0"
description = "Open-source, model-agnostic agentic AI framework supporting 12+ LLM providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OpenGravity Contributors" },
]
keywords = ["ai", "agent", "llm", "tool-calling", "multi-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
opengravity = "opengravity.cli.app:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opengravity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
